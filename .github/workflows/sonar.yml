name: Sonar quality policy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  quality:
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOTOOLCHAIN: local
      GOPROXY: "off"
      CGO_ENABLED: "0"
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/checkout-language-server
        with:
          read-key: ${{ secrets.BIFOIL_LANGUAGE_SERVER_READ_KEY }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: 1.26.3
          cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Test the per-file coverage policy
        run: |
          # These tests use only the standard library and the installed system interpreter.
          policy_python="$(uv python find --system python3)"
          "$policy_python" -m unittest discover -s scripts/test -p 'test_*.py'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Install dependencies with the declared build permissions
        run: pnpm install --frozen-lockfile
      - name: Build and check source types
        run: |
          pnpm build
          pnpm typecheck
      - name: Collect source-mapped JavaScript condition coverage
        id: javascript
        run: pnpm test:coverage
      - name: Retain parser branch coordinates from the successful collection
        if: always() && steps.javascript.outcome == 'success'
        run: |
          node node_modules/c8/bin/c8.js report --reporter=json --reports-dir=dist/coverage/javascript-diagnostics
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const report = JSON.parse(await readFile('dist/coverage/javascript-diagnostics/coverage-final.json', 'utf8'));
          const name = 'packages/core/src/parser.ts';
          const entry = Object.entries(report).find(([file]) => file === name || file.endsWith('/' + name));
          if (!entry) throw new Error('The successful collection has no parser branch coordinates');
          const sha256 = createHash('sha256').update(await readFile(name)).digest('hex');
          await writeFile('dist/coverage/parser-conditions.json', JSON.stringify({ revision: process.env.GITHUB_SHA, sha256, coverage: entry[1] }));
          NODE
      - name: Retain measured JavaScript coverage for branch diagnostics
        if: always() && steps.javascript.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: javascript-condition-coverage
          path: |
            dist/coverage/javascript.lcov
            dist/coverage/parser-conditions.json
          if-no-files-found: error
          retention-days: 1
      - name: Use a matched LLVM installation for the original C coverage shim
        run: |
          if ! test -x /usr/lib/llvm-18/bin/llvm-cov; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends clang-18 llvm-18 lld-18
          fi
      - name: Collect original C source coverage and describe the shipped wasm32 ABI
        id: native
        run: |
          node node_modules/c8/bin/c8.js --all=false --include=scripts/test-coverage-c.mjs --include=scripts/artifact-paths.mjs --temp-directory=.cache/coverage/linux-c-v8 --reports-dir=dist/coverage/javascript-linux-c node scripts/test-coverage-c.mjs
          node scripts/coverage-report.mjs dist/coverage/javascript.lcov dist/coverage/javascript.lcov dist/coverage/javascript-linux-c/lcov.info
          node scripts/sonar-compile-commands.mjs
        env:
          BIFOIL_LLVM_BIN: /usr/lib/llvm-18/bin
      - name: Prepare only the current host's resources for native IDE tests
        run: pnpm package:intellij --current
      - name: Collect native Kotlin condition coverage
        id: kotlin
        run: bash editors/intellij/gradlew -p editors/intellij -Pcoverage=true test jacocoTestReport
      - name: Require tests and at least 80% coverage for each production source file
        run: |
          python3 - <<'PY'
          """Require measured test execution in every analyzed production source file."""
          import fnmatch
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path
          import xml.etree.ElementTree as XML

          root = Path.cwd().resolve()
          properties = {}
          for row in (root / "sonar-project.properties").read_text().splitlines():
              if row.strip() and not row.lstrip().startswith("#"):
                  key, value = row.split("=", 1)
                  properties[key.strip()] = value.strip()

          def patterns(key):
              return [item.strip() for item in properties.get(key, "").split(",") if item.strip()]

          def matches(path, values):
              return any(fnmatch.fnmatchcase(path, value) for value in values)

          extensions = {".rs", ".py", ".js", ".mjs", ".cjs", ".ts", ".kt", ".go", ".c", ".h"}
          sources = set()
          files = subprocess.check_output(["git", "ls-files", "--cached", "--others", "--exclude-standard", "-z"], text=True)
          for name in set(files.split("\0")) - {""}:
              file = root / name
              if file.is_file() and file.suffix in extensions:
                  test = matches(name, patterns("sonar.test.inclusions") + patterns("sonar.coverage.exclusions"))
                  test = test or any(file.is_relative_to(root / base) for base in patterns("sonar.tests") if not patterns("sonar.test.inclusions"))
                  if not test and not matches(name, patterns("sonar.exclusions")):
                      sources.add(name)
          covered = set()
          reported = set()

          line_coverage = {}
          branch_coverage = {}

          def record(name, lines, branches=()):
              path = Path(name)
              if path.is_absolute():
                  if not path.is_relative_to(root):
                      return
                  name = path.relative_to(root).as_posix()
              name = name.replace("\\", "/")
              reported.add(name)
              measured = line_coverage.setdefault(name, {})
              for number, hits in lines:
                  if number <= 0 or hits < 0:
                      raise SystemExit("Invalid executable-line counts: " + name)
                  measured[number] = measured.get(number, False) or hits > 0
              if any(measured.values()):
                  covered.add(name)
              outcomes = branch_coverage.setdefault(name, {})
              for number, hit, total in branches:
                  if number <= 0 or not 0 <= hit <= total:
                      raise SystemExit("Invalid condition counts: " + name)
                  if number in outcomes and outcomes[number] != (hit, total):
                      raise SystemExit("Conflicting condition reports: " + name)
                  outcomes[number] = (hit, total)

          def xml_branches(lines, number_key):
              for line in lines:
                  if line.attrib.get("branch") == "true" and "condition-coverage" not in line.attrib:
                      raise SystemExit("Missing exact condition counts")
                  if "condition-coverage" in line.attrib:
                      match = re.search(r"\((\d+)/(\d+)\)$", line.attrib["condition-coverage"])
                      if match is None:
                          raise SystemExit("Missing exact condition counts")
                      hit, total = map(int, match.groups())
                  else:
                      hit = int(line.attrib.get("coveredBranches", "0"))
                      total = int(line.attrib.get("branchesToCover", "0"))
                  yield int(line.attrib[number_key]), hit, total

          for key in ("sonar.javascript.lcov.reportPaths", "sonar.rust.lcov.reportPaths"):
              for name in patterns(key):
                  text = (root / name).read_text()
                  for block in text.split("end_of_record"):
                      file = re.search(r"^SF:([^\r\n]+)", block, re.M)
                      if file:
                          lines = [(int(number), int(hits)) for number, hits in
                                   re.findall(r"^DA:(\d+),(-?\d+)(?:,[^,\r\n]+)?$", block, re.M)]
                          if len(lines) != sum(row.startswith("DA:") for row in block.splitlines()):
                              raise SystemExit("Malformed LCOV executable-line counts")
                          if sum(row.startswith("SF:") for row in block.splitlines()) != 1:
                              raise SystemExit("An LCOV record must identify one source")
                          conditions = {}
                          positions = set()
                          for number, group, branch, hits in re.findall(r"^BRDA:(\d+),([^,]+),([^,]+),([^\r\n]+)", block, re.M):
                              position = (number, group, branch)
                              if position in positions:
                                  raise SystemExit("Duplicate LCOV condition")
                              positions.add(position)
                              count = 0 if hits == "-" else int(hits)
                              if count < 0:
                                  raise SystemExit("Invalid LCOV condition count")
                              hit, total = conditions.get(int(number), (0, 0))
                              conditions[int(number)] = (hit + (count > 0), total + 1)
                          if len(positions) != sum(row.startswith("BRDA:") for row in block.splitlines()):
                              raise SystemExit("Malformed LCOV condition counts")
                          record(file[1], lines, [(number, hit, total) for number, (hit, total) in conditions.items()])
          for name in patterns("sonar.python.coverage.reportPaths"):
              document = XML.parse(root / name).getroot()
              bases = [element.text or "" for element in document.findall("./sources/source")]
              for item in document.findall(".//class"):
                  filename = item.attrib["filename"]
                  candidates = [Path(filename), *(Path(base) / filename for base in bases)]
                  selected = next((path for path in candidates if (root / path).is_file()), None)
                  if selected is None:
                      raise SystemExit("Unresolvable coverage source: " + filename)
                  lines = item.findall("./lines/line")
                  record(str(selected), [(int(line.attrib["number"]), int(line.attrib["hits"])) for line in lines],
                         xml_branches(lines, "number"))
          go_sources = {}

          def go_executable_lines(name, first, first_column, last, last_column):
              # Match the Go importer's treatment of boundary braces and blank lines.
              if name not in go_sources:
                  go_sources[name] = (root / name).read_text().split("\n")
              source = go_sources[name]
              def boundary(line, column):
                  if not 1 <= line <= len(source) or column <= 0:
                      return False
                  text = source[line - 1]
                  return column > len(text) or text[column - 1] in "{}" or ord(text[column - 1]) < 32
              while boundary(first, first_column):
                  first_column += 1
                  if first_column > len(source[first - 1]):
                      first, first_column = first + 1, 1
              if last > len(source):
                  last, last_column = len(source), len(source[-1]) + 1
              last_column -= 1
              while last > first and boundary(last, last_column):
                  last_column -= 1
                  if last_column == 0:
                      last -= 1
                      last_column = len(source[last - 1])
              return [number for number in range(first, last + 1) if source[number - 1].strip()]

          for name in patterns("sonar.go.coverage.reportPaths"):
              module = re.search(r"^module\s+(\S+)", (root / "go.mod").read_text(), re.M)[1]
              rows = (root / name).read_text().splitlines()
              if not rows or rows[0] not in {"mode: set", "mode: count", "mode: atomic"}:
                  raise SystemExit("Invalid Go coverage header")
              for row in rows[1:]:
                  location, statements, hits = row.split()
                  file, coordinates = location.rsplit(":", 1)
                  match = re.fullmatch(r"([1-9]\d*)\.([1-9]\d*),([1-9]\d*)\.([1-9]\d*)", coordinates)
                  if match is None or int(statements) < 0 or int(hits) < 0:
                      raise SystemExit("Invalid Go coverage counters")
                  start, column, end, end_column = map(int, match.groups())
                  if (start, column) > (end, end_column):
                      raise SystemExit("Invalid Go coverage range")
                  filename = file.removeprefix(module + "/")
                  lines = go_executable_lines(filename, start, column, end, end_column)
                  record(filename, [(number, int(hits)) for number in lines])
          for name in patterns("sonar.coverageReportPaths"):
              for item in XML.parse(root / name).getroot().findall("file"):
                  lines = item.findall("lineToCover")
                  if any(line.attrib["covered"] not in {"true", "false"} for line in lines):
                      raise SystemExit("Invalid generic line coverage")
                  record(item.attrib["path"], [(int(line.attrib["lineNumber"]), line.attrib["covered"] == "true") for line in lines],
                         xml_branches(lines, "lineNumber"))
          for name in patterns("sonar.coverage.jacoco.xmlReportPaths"):
              for package in XML.parse(root / name).getroot().findall("package"):
                  for item in package.findall("sourcefile"):
                      suffix = package.attrib["name"] + "/" + item.attrib["name"]
                      candidates = [candidate for candidate in sources if candidate.endswith(suffix)]
                      if not candidates:
                          # Kotlin can emit inline-library source entries that have no repository source.
                          # Missing production coverage is still rejected by the complete source inventory below.
                          print("IGNORED JaCoCo source outside analyzed inventory: " + suffix)
                          continue
                      if len(candidates) != 1:
                          raise SystemExit("Ambiguous or missing JaCoCo source: " + suffix)
                      lines = item.findall("line")
                      for line in lines:
                          if any(int(line.attrib[key]) < 0 for key in ("mi", "ci", "mb", "cb")):
                              raise SystemExit("Invalid JaCoCo coverage counts")
                      record(candidates[0], [(int(line.attrib["nr"]), int(line.attrib["ci"])) for line in lines],
                             [(int(line.attrib["nr"]), int(line.attrib["cb"]),
                               int(line.attrib["cb"]) + int(line.attrib["mb"])) for line in lines])
          if not sources:
              raise SystemExit("No production source files selected; refusing an empty test check")
          mapping = root / "source-test-map.json"
          compile_tested = set()
          if mapping.is_file():
              for name, evidence in json.loads(mapping.read_text())["compile_only"].items():
                  path = root / name
                  text = path.read_text()
                  test = root / evidence["test"]
                  if name not in sources or path.suffix != ".rs":
                      raise SystemExit("Invalid declaration-only source: " + name)
                  if hashlib.sha256(path.read_bytes()).hexdigest() != evidence["sha256"]:
                      raise SystemExit("Declaration-only source changed; review its test mapping: " + name)
                  if re.search(r"^\s*(?:(?:pub(?:\([^)]*\))?|async|unsafe)\s+)*(?:fn|impl|const|static)\b", text, re.M):
                      raise SystemExit("Executable Rust source cannot use compilation-only evidence: " + name)
                  expression = r"#\[test\]\s*fn\s+" + re.escape(evidence["case"]) + r"\("
                  if not test.is_file() or not re.search(expression, test.read_text()):
                      raise SystemExit("Missing compilation test: " + name)
                  compile_tested.add(name)
                  print("COMPILE-TESTED " + name + " via " + evidence["test"] + "::" + evidence["case"])
          missing = sorted(sources - covered - compile_tested)
          for name in missing:
              print(("UNTESTED " if name in reported else "UNMEASURED ") + name)
          print(f"Test evidence verified for {len(sources - set(missing))}/{len(sources)} production source files")
          below_minimum = []
          for name in sorted(sources - set(missing)):
              lines = line_coverage.get(name, {})
              branches = branch_coverage.get(name, {})
              hit = sum(lines.values()) + sum(value[0] for value in branches.values())
              total = len(lines) + sum(value[1] for value in branches.values())
              if total == 0:
                  print("N/A " + name + ": no executable Sonar coverage locations; test evidence verified")
                  continue
              # Use exact counts; a displayed 80.00% must never hide a lower result.
              passed = 100 * hit >= 80 * total
              print(f"{'COVERED' if passed else 'LOW COVERAGE'} {name}: {100 * hit / total:.2f}% ({hit}/{total}); required >=80%")
              if not passed:
                  below_minimum.append(name)
          condition_hits = sum(hit for name in sources for hit, _ in branch_coverage.get(name, {}).values())
          condition_total = sum(total for name in sources for _, total in branch_coverage.get(name, {}).values())
          print(f"OVERALL CONDITIONS {condition_hits}/{condition_total}; required 100%")
          if condition_hits != condition_total:
              raise SystemExit("Overall condition coverage must be 100%")
          if missing or below_minimum:
              raise SystemExit(1)
          PY
      - name: Authenticate this project through GitHub OIDC
        if: >-
          always() && steps.javascript.outcome == 'success' && steps.native.outcome == 'success' &&
          steps.kotlin.outcome == 'success'
        id: sonar-auth
        uses: SonarSource/sonarqube-auth-action@a0aa643acde4162396015b4f12536c1b9c4aab82 # v1
        with:
          export-env: false
          project-key: bifoil_bifoil-choicescript
      - name: Submit all measured coverage and wait for the strict gate
        if: >-
          always() && steps.javascript.outcome == 'success' && steps.native.outcome == 'success' &&
          steps.kotlin.outcome == 'success'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          args: -Dsonar.qualitygate.wait=true -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token }}
