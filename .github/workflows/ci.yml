name: Build and verify
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_packages:
        description: Build installers and run packaged-editor verification
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_packages:
        description: Build installers and run packaged-editor verification
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  javascript:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve upstream line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with: { go-version: "1.26.3", cache: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with: { node-version: 24.21.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: go test ./packages/core/src ./native/server
      - run: pnpm check
      - if: inputs.build_packages
        run: pnpm package:vscode
      - if: inputs.build_packages
        run: node scripts/extract-vsix.mjs
      - if: inputs.build_packages
        run: node scripts/test-bundle.mjs
      - if: inputs.build_packages && runner.os == 'Linux'
        run: xvfb-run -a node scripts/test-vscode.mjs
      - if: inputs.build_packages && runner.os != 'Linux'
        run: node scripts/test-vscode.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}
          path: dist/test-results
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: inputs.build_packages
        with:
          name: vscode-${{ matrix.os }}
          path: dist/packages/*.vsix
          retention-days: 1
  intellij:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        product: [idea, webstorm, pycharm]
    runs-on: ubuntu-24.04
    steps:
      - name: Reserve space for the selected IDE SDK
        run: |
          # These unused SDKs belong to the disposable GitHub-hosted image.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /
      - name: Preserve upstream line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with: { go-version: "1.26.3", cache: false }
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@v7
        with: { node-version: 24.21.0, cache: pnpm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          # Avoid restoring several gigabytes of another matrix product's SDK.
          cache-disabled: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Prepare host runtime for native tests
        if: ${{ !inputs.build_packages }}
        run: pnpm package:intellij --current
      - name: Prepare release runtime resources
        if: inputs.build_packages
        run: pnpm package:intellij
      - name: Run native tests
        run: bash editors/intellij/gradlew -p editors/intellij -PplatformProduct=${{ matrix.product }} test
      - name: Build and verify installer
        if: inputs.build_packages
        run: bash editors/intellij/gradlew -p editors/intellij -PplatformProduct=${{ matrix.product }} buildPlugin verifyPlugin
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnostics-intellij-${{ matrix.product }}
          path: |
            editors/intellij/build/reports
            editors/intellij/build/test-results
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: inputs.build_packages && matrix.product == 'idea'
        with:
          name: intellij-${{ matrix.product }}
          path: editors/intellij/build/distributions/*.zip
          retention-days: 1
