name: Initialize pinned language server and engine
description: Check out the exact gitlink or explicit native qualification candidate, then initialize the public engine.
inputs:
  read-key:
    description: Read-only deploy key for bifoil/bifoil-language-server
    required: true
  candidate-revision:
    description: Optional exact private native revision for explicit candidate qualification; normal builds use the gitlink.
    required: false
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      env:
        CANDIDATE_REVISION: ${{ inputs.candidate-revision }}
      run: |
        revision="$CANDIDATE_REVISION"
        if [[ -n "$revision" ]]; then
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || exit 64
        else
          revision="$(git rev-parse HEAD:vendor/bifoil-language-server)"
        fi
        echo "revision=$revision" >> "$GITHUB_OUTPUT"
    - name: Prepare private SSH temporary storage on Windows
      if: runner.os == 'Windows'
      id: ssh-temp
      shell: pwsh
      run: |
        $directory = Join-Path $env:RUNNER_TEMP ("bifoil-ssh-" + [Guid]::NewGuid().ToString("N"))
        $null = New-Item -ItemType Directory -Path $directory
        $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
        $acl = [System.Security.AccessControl.DirectorySecurity]::new()
        $acl.SetOwner($identity)
        $acl.SetAccessRuleProtection($true, $false)
        $inheritance = [System.Security.AccessControl.InheritanceFlags]::ContainerInherit -bor
          [System.Security.AccessControl.InheritanceFlags]::ObjectInherit
        $rule = [System.Security.AccessControl.FileSystemAccessRule]::new(
          $identity, [System.Security.AccessControl.FileSystemRights]::FullControl,
          $inheritance, [System.Security.AccessControl.PropagationFlags]::None,
          [System.Security.AccessControl.AccessControlType]::Allow)
        $acl.AddAccessRule($rule)
        Set-Acl -LiteralPath $directory -AclObject $acl
        "directory=$directory" >> $env:GITHUB_OUTPUT
    - uses: actions/checkout@v7
      if: runner.os != 'Windows'
      with:
        repository: bifoil/bifoil-language-server
        ref: ${{ steps.pin.outputs.revision }}
        path: vendor/bifoil-language-server
        ssh-key: ${{ inputs.read-key }}
        persist-credentials: false
    - name: Check out private source with explicit Windows key permissions
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        PRIVATE_NATIVE_READ_KEY: ${{ inputs.read-key }}
        PRIVATE_NATIVE_REVISION: ${{ steps.pin.outputs.revision }}
        PRIVATE_NATIVE_SSH_DIRECTORY: ${{ steps.ssh-temp.outputs.directory }}
      run: |
        $ErrorActionPreference = 'Stop'
        $directory = $env:PRIVATE_NATIVE_SSH_DIRECTORY
        $key = Join-Path $directory 'id_native'
        $knownHosts = Join-Path $directory 'known_hosts'
        $previousCommand = $env:GIT_SSH_COMMAND
        function Invoke-NativeGit([string[]] $GitArguments) {
          & git @GitArguments
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency Git operation failed.' }
        }
        try {
          if ([string]::IsNullOrWhiteSpace($env:PRIVATE_NATIVE_READ_KEY)) {
            throw 'The native dependency read key is required.'
          }
          $lineFeed = [string][char]10
          $carriageReturnLineFeed = [string][char]13 + $lineFeed
          [System.IO.File]::WriteAllText($key,
            $env:PRIVATE_NATIVE_READ_KEY.Trim().Replace($carriageReturnLineFeed, $lineFeed) + $lineFeed,
            [System.Text.UTF8Encoding]::new($false))
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
          $acl = [System.Security.AccessControl.FileSecurity]::new()
          $acl.SetOwner($identity)
          $acl.SetAccessRuleProtection($true, $false)
          $acl.AddAccessRule([System.Security.AccessControl.FileSystemAccessRule]::new(
            $identity, [System.Security.AccessControl.FileSystemRights]::FullControl,
            [System.Security.AccessControl.AccessControlType]::Allow))
          Set-Acl -LiteralPath $key -AclObject $acl
          Copy-Item -LiteralPath '.github/github-ssh-known-hosts' -Destination $knownHosts
          $ssh = (Get-Command ssh.exe).Source.Replace('\', '/')
          $keyPath = $key.Replace('\', '/')
          $hostsPath = $knownHosts.Replace('\', '/')
          $env:GIT_SSH_COMMAND = '"{0}" -i "{1}" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile={2}"' -f $ssh, $keyPath, $hostsPath
          $destination = 'vendor/bifoil-language-server'
          Invoke-NativeGit -GitArguments @('init', $destination)
          Invoke-NativeGit -GitArguments @('-C', $destination, 'remote', 'add', 'origin', 'git@github.com:bifoil/bifoil-language-server.git')
          Invoke-NativeGit -GitArguments @('-C', $destination, 'fetch', '--depth=1', 'origin', $env:PRIVATE_NATIVE_REVISION)
          Invoke-NativeGit -GitArguments @('-C', $destination, 'checkout', '--detach', 'FETCH_HEAD')
        } finally {
          $env:GIT_SSH_COMMAND = $previousCommand
          Remove-Item -LiteralPath $directory -Recurse -Force
        }
    - name: Initialize pinned engine
      shell: bash
      run: git -c core.autocrlf=false submodule update --init --recursive vendor/choicescript
