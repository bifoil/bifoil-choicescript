name: Initialize pinned language server and engine
description: Check out the exact gitlink or explicit native qualification candidate, then initialize the public engine.
inputs:
  read-key:
    description: Read-only deploy key for bifoil/bifoil-language-server
    required: true
  candidate-revision:
    description: Optional exact private native revision for explicit candidate qualification; normal builds use the gitlink.
    required: false
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      env:
        CANDIDATE_REVISION: ${{ inputs.candidate-revision }}
      run: |
        revision="$CANDIDATE_REVISION"
        if [[ -n "$revision" ]]; then
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || exit 64
        else
          revision="$(git rev-parse HEAD:vendor/bifoil-language-server)"
        fi
        echo "revision=$revision" >> "$GITHUB_OUTPUT"
    - name: Prepare private SSH temporary storage on Windows
      if: runner.os == 'Windows'
      id: ssh-temp
      shell: pwsh
      run: |
        $directory = Join-Path $env:RUNNER_TEMP ("bifoil-ssh-" + [Guid]::NewGuid().ToString("N"))
        $null = New-Item -ItemType Directory -Path $directory
        $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
        $acl = [System.Security.AccessControl.DirectorySecurity]::new()
        $acl.SetOwner($identity)
        $acl.SetAccessRuleProtection($true, $false)
        $inheritance = [System.Security.AccessControl.InheritanceFlags]::ContainerInherit -bor
          [System.Security.AccessControl.InheritanceFlags]::ObjectInherit
        $rule = [System.Security.AccessControl.FileSystemAccessRule]::new(
          $identity, [System.Security.AccessControl.FileSystemRights]::FullControl,
          $inheritance, [System.Security.AccessControl.PropagationFlags]::None,
          [System.Security.AccessControl.AccessControlType]::Allow)
        $acl.AddAccessRule($rule)
        Set-Acl -LiteralPath $directory -AclObject $acl
        "directory=$directory" >> $env:GITHUB_OUTPUT
    - uses: actions/checkout@v7
      env:
        RUNNER_TEMP: ${{ steps.ssh-temp.outputs.directory || runner.temp }}
      with:
        repository: bifoil/bifoil-language-server
        ref: ${{ steps.pin.outputs.revision }}
        path: vendor/bifoil-language-server
        ssh-key: ${{ inputs.read-key }}
        persist-credentials: false
    - name: Initialize pinned engine
      shell: bash
      run: git -c core.autocrlf=false submodule update --init --recursive vendor/choicescript
