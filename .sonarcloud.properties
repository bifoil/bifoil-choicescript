# Scope for the existing SonarQube Cloud automatic analysis.
# Keep upstream material, installed runtimes, generated output and private local data outside analysis.
sonar.sources=packages,native,scripts,editors/vscode/src,editors/vscode/test,editors/intellij/src,editors/intellij/build.gradle.kts,editors/intellij/settings.gradle.kts,editors/intellij/gradle.lockfile,.github,go.mod,package.json,tsconfig.json,pnpm-workspace.yaml
sonar.tests=packages,native/server,native/environment/test,scripts/test,editors/vscode/test,editors/intellij/src/test
sonar.test.inclusions=**/*_test.go,**/test/**,**/src/test/**
sonar.exclusions=**/inspections/**,vendor/choicescript/**,**/node_modules/**,**/build/**,**/bundle/**,packages/core/src/environment-binary.ts
sonar.sourceEncoding=UTF-8
